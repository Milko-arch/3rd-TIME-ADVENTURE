color:var(--purple);box-shadow:none}.btn.green{background:var(--green);border-bottom-color:#209a6d}.btn.pink{background:var(--pink);border-bottom-color:#bb3781}.btn.small{padding:9px 13px;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}.tag{display:inline-block;border-radius:99px;background:#efeaff;color:#7459ee;padding:7px 13px;font-weight:900;font-size:13px;letter-spacing:.08em}.route{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.node{border-radius:22px;background:white;border:2px solid #e4dff5;padding:17px 8px;text-align:center;font-weight:900}.node b{display:block;font-size:32px;margin-bottom:5px}.node.active{border-color:#8364ff;box-shadow:0 6px 0 #d8d0ff}.node.done{border-color:#72d9b2}.clockwrap{display:grid;place-items:center}.clock{width:min(280px,80vw);height:auto;max-width:100%;filter:drop-shadow(0 8px 6px #4b408019);touch-action:none}.digital{display:inline-block;font-size:clamp(28px,5vw,45px);font-weight:1000;letter-spacing:2px;color:#fff;background:#243253;padding:16px 25px;border-radius:18px;border:6px solid #48577c;box-shadow:0 9px 0 #b7bed1}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.choice{background:#f8f7ff;border:3px solid #e8e4f7;border-bottom-width:6px;border-radius:17px;min-height:70px;padding:14px;font-weight:900;font-size:18px;color:#34365c}.choice:hover:not(:disabled){border-color:#8a72fc}.choice.selected{background:#e8e0ff;border-color:#785cf6}.choice.correct{background:#e4fff3;border-color:#33c88b}.choice.wrong{background:#ffe9ed;border-color:#fa758a}.big{font-size:24px;font-weight:1000}.muted{color:#73809d}.feedback{margin:17px 0;padding:17px;border-radius:16px;background:#f1eeff;border:1px solid #e3dafa;font-weight:800;line-height:1.5}.visualbox{background:linear-gradient(140deg,#f3f1ff,#eefaff);padding:25px 15px;border-radius:25px;text-align:center}.timeline{margin:28px 0;display:flex;align-items:center;justify-cont const app=document.getElementById('app');let sound=true,stars=0,level=0,mode='welcome',lesson=0,practiceAnswer=false,quizIndex=0,answers=[],questions=[],focus=new Set(),certName='',attempt=1,lock=false;const lessons=[{title:'Meet the Clock',emoji:'🕒',concept:'analog',text:'An analog clock has two hands. The short hand tells the hour. The long hand tells the minutes. When the long hand points to 12, it is exactly o’clock.'},{title:'Digital Time',emoji:'📟',concept:'digital',text:'A digital clock uses numbers. The first number shows the hour, and the second shows the minutes. 13:00 is the same as 1:00 PM. 20:00 is 8:00 PM.'},{title:'Morning or Afternoon?',emoji:'☀️',concept:'ampm',text:'AM is from midnight until before noon. PM is from noon until before midnight. 8:00 AM is in the morning. 2:00 PM is in the afternoon.'},{title:'Time Jumps',emoji:'🚀',concept:'elapsed',text:'Elapsed time is how much time passes from start to finish. Jump to the next full hour, then count any hours and minutes left.'},{title:'Movie Time',emoji:'🎬',concept:'movies',text:'To find how long a movie lasts, subtract the start time from the end time. To find the end time, add the duration to the start time.'}];
function speak(s){if(!sound||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s.replace(/<[^>]*>/g,''));u.lang='en-US';u.rate=.83;u.pitch=1.08;let vv=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('en'));if(vv.length)u.voice=vv.find(x=>/Google US English|Samantha|Aria|Jenny/i.test(x.name))||vv[0];speechSynthesis.speak(u)}let activeFeedbackSpeech=null;
function speakThenAdvance(message,callback){
  // One response, one narration, one automatic transition.
  const token=Symbol('feedback');
  window.feedbackToken=token;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(activeFeedbackSpeech){clearInterval(activeFeedbackSpeech.watchdog);clearTimeout(activeFeedbackSpeech.fallback)}
  let finished=false;
  const finish=()=>{
    if(finished||window.feedbackToken!==token)return;
    finished=true;
    window.feedbackToken=null;
    if(activeFeedbackSpeech){clearInterval(activeFeedbackSpeech.watchdog);clearTimeout(activeFeedbackSpeech.fallback);activeFeedbackSpeech=null}
    setTimeout(()=>{if(typeof callback==='function')callback()},450);
  };
  if(!sound||!('speechSynthesis' in window)){
    activeFeedbackSpeech={watchdog:null,fallback:setTimeout(finish,900),finish};
    return;
  }
  const u=new SpeechSynthesisUtterance(message.replace(/<[^>]*>/g,''));
  u.lang='en-US';u.rate=.82;u.pitch=1.06;
  const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));
  if(voices.length)u.voice=voices.find(v=>/Google US English|Samantha|Aria|Jenny/i.test(v.name))||voices[0];
  u.onend=finish;
  u.onerror=finish;
  // Browser fallback: onend sometimes fails, especially on mobile Chrome.
  // Never transition while speech is still playing.
  let speechStarted=false;
  const created=Date.now();
  const watchdog=setInterval(()=>{
    if(finished||window.feedbackToken!==token)return;
    const playing=speechSynthesis.speaking||speechSynthesis.pending;
    if(playing)speechStarted=true;
    if(speechStarted&&!playing&&Date.now()-created>1100)finish();
  },250);
  const fallback=setTimeout(()=>{
    if(!finished&&!speechSynthesis.speaking&&!speechSynthesis.pending)finish();
  },Math.max(4500,message.length*90));
  activeFeedbackSpeech={watchdog,fallback,finish,utterance:u};
  try{speechSynthesis.speak(u)}catch(e){finish()}
}
function toggleSound(){sound=!sound;document.getElementById('soundBtn').textContent=sound?'🔊 English Voice ON':'🔇 Voice OFF';if(!sound){speechSynthesis.cancel();if(activeFeedbackSpeech)activeFeedbackSpeech.finish()}}function cheer(){for(let i=0;i<42;i++){let x=document.createElement('span');x.className='confetti';x.style.left=Math.random()*100+'vw';x.style.background=['#ff67a9','#ffce56','#7b67f4','#4acfaa','#4ec4f7'][i%5];x.style.animationDuration=1.6+Math.random()*2+'s';x.style.animationDelay=Math.random()*.5+'s';document.body.append(x);setTimeout(()=>x.remove(),4000)}}function award(n=10){stars+=n;document.getElementById('points').textContent='⭐ '+stars+' stars'}function card(s){app.innerHTML='<div class="card">'+s+'</div>'}function route(){return '<div class="route">'+['🧠 Learn','🎯 Practice','📝 Quiz','🏆 Award'].map((a,i)=>'<div class="node '+(i<level?'done':i===level?'active':'')+'"><b>'+a.split(' ')[0]+'</b>'+a.split(' ').slice(1).join(' ')+'</div>').join('')+'</div>'}function progress(n){document.getElementById('progress').style.width=n+'%';document.getElementById('status').textContent='🏆 Level '+Math.max(1,level+1)}function clock(h=1,m=0,id='clock'){let cx=130,cy=130;let digits=Array.from({length:12},(_,i)=>{let n=i+1,a=(n*30-90)*Math.PI/180;return `<text x="${cx+94*Math.cos(a)}" y="${cy+94*Math.sin(a)+6}" text-anchor="middle" font-size="20" font-weight="900" fill="#445276">${n}</text>`}).join('');let a=(h%12+m/60)*30-90,b=m*6-90;let hand=(deg,len,w,color)=>`<line x1="130" y1="130" x2="${cx+len*Math.cos(deg*Math.PI/180)}" y2="${cy+len*Math.sin(deg*Math.PI/180)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;return `<svg class="clock" viewBox="0 0 260 260" role="img" aria-label="Analog clock showing ${h}:${String(m).padStart(2,'0')}"><circle cx="130" cy="130" r="119" fill="#fff" stroke="#7b61f6" stroke-width="10"/><circle cx="130" cy="130" r="108" fill="#f8faff" stroke="#e9e6ff" stroke-width="2"/>${Array.from({length:60},(_,i)=>{let q=i*Math.PI/30,r1=i%5?109:103;return `<line x1="${130+r1*Math.sin(q)}" y1="${130-r1*Math.cos(q)}" x2="${130+114*Math.sin(q)}" y2="${130-114*Math.cos(q)}" stroke="#ac9fcb" stroke-width="${i%5?1.5:3}"/>`}).join('')}${digits}${hand(a,63,11,'#32446f')}${hand(b,85,7,'#f163a7')}<circle cx="130" cy="130" r="9" fill="#ffce59" stroke="#32446f" stroke-width="3"/></svg>`}
function timeFmt(t,format24=false){let h=Math.floor(t/60)%24,m=t%60;return (format24?String(h).padStart(2,'0'):String(h%12||12))+':'+String(m).padStart(2,'0')+(format24?'':h<12?' AM':' PM')}function timeline(times){return `<div class="timeline">${times.map((t,i)=>`<div class="tick"><div class="dot">${i?'✓':'▶'}</div><small>${t}</small></div>`).join('')}</div>`}function lessonVisual(k){if(k===0)return `<div class="visualbox">${clock(8)}<p><b>Blue short hand = hour 8</b></p><p><b style="color:#e65798">Pink long hand = 00 minutes</b></p></div>`;if(k===1)return `<div class="visualbox">${clock(1)}<br><div class="digital">13:00</div><p>1:00 PM = 13:00</p></div>`;if(k===2)return `<div class="visualbox"><div style="font-size:72px">🌅　🌙</div><h2>8:00 AM　 •　8:00 PM</h2><p>Same hour. Different parts of the day!</p></div>`;if(k===3)return `<div class="visualbox"><h3>11:55 AM → 1:20 PM</h3>${timeline(['11:55','12:00','1:00','1:20'])}<p>+5 minutes　+60 minutes　+20 minutes</p><h2>1 hour 25 minutes</h2></div>`;return `<div class="visualbox"><div style="font-size:75px">🎟️ 🍿 🎬</div><h3>2:35 → 4:05</h3>${timeline(['2:35','3:00','4:00','4:05'])}<h2>1 hour 30 minutes</h2></div>`}
function welcome(){mode='welcome';level=0;progress(0);app.innerHTML=`${route()}<div class="hero"><div class="mascot">🦊⏰</div><span class="tag">THE CLOCK QUEST</span><h1>Become a<br><span style="color:var(--purple)">Time Master!</span></h1><p>Listen, play, earn stars, and unlock your Time Master Certificate.</p><div class="actions"><button class="btn green" onclick="startLearn()">🚀 Start Adventure</button></div></div><div class="card"><h3>✨ Your mission</h3><p>Explore five fun time concepts, try hands-on clock activities, and take a 12-question challenge. Score at least 80% to earn your certificate. If you miss the target, you will revisit the concepts you need!</p></div>`}function startLearn(){mode='learn';level=0;lesson=0;showLesson()}function showLesson(){level=0;progress(5+lesson*9);let l=lessons[lesson];card(`<span class="tag">LESSON ${lesson+1} OF ${lessons.length}</span><h2 class="sectionTitle">${l.emoji} ${l.title}</h2><div class="twocol"><div>${lessonVisual(lesson)}</div><div><h3>💡 Discover</h3><p style="font-size:20px;line-height:1.7">${l.text}</p><button class="btn secondary" onclick="speak(lessons[lesson].text)">🔊 Hear Explanation</button></div></div><div class="actions"><button class="btn green" onclick="nextLesson()">${lesson===lessons.length-1?'🎯 Try the Practice':'➡️ Next Discovery'}</button></div>`);speak(l.text)}function nextLesson(){award(5);if(++lesson<lessons.length)showLesson();else{practiceAnswer=false;showPractice(0)}}
const practices=[{topic:'analog',prompt:'Set the analog clock to 8 o’clock.',type:'hands',correct:8},{topic:'digital',prompt:'What does 20:00 mean?',type:'choice',opts:['8:00 AM','8:00 PM','2:00 PM','10:00 PM'],correct:1},{topic:'ampm',prompt:'At 3:00 in the morning, do we use AM or PM?',type:'choice',opts:['AM','PM','Both','Neither'],correct:0},{topic:'elapsed',prompt:'From 3:30 AM to 5:30 AM, how much time passes?',type:'choice',opts:['1 hour','2 hours','3 hours','2 hours 30 minutes'],correct:1},{topic:'movies',prompt:'A movie starts at 5:20 and lasts 1 hour 50 minutes. When does it end?',type:'choice',opts:['6:10','6:50','7:10','7:20'],correct:2}];let practiceI=0,handValue=1;function showPractice(i){mode='practice';level=1;practiceI=i;practiceAnswer=false;progress(52+i*5);let p=practices[i];let body=p.type==='hands'?`<div class="clockwrap" id="handsView">${clock(handValue)}</div><p style="text-align:center">Move the hour hand with the slider:</p><input aria-label="Clock hour" class="slider" type="range" min="1" max="12" step="1" value="${handValue}" oninput="handValue=+this.value;document.getElementById('handsView').innerHTML=clock(handValue);document.getElementById('handlabel').textContent=handValue+':00'"/><p class="big" style="text-align:center" id="handlabel">${handValue}:00</p><div class="actions"><button class="btn green" onclick="practiceCheck(handValue===8)">Check my clock ✓</button></div>`:`<div class="choicegrid">${p.opts.map((x,j)=>`<button class="choice" onclick="practiceCheck(${j===p.correct},this)">${x}</button>`).join('')}</div>`;card(`<span class="tag">PRACTICE ${i+1} / 5</span><h2 class="sectionTitle">🎯 Let's Try!</h2><p class="big">${p.prompt}</p><button class="btn small secondary" onclick="speak(practices[practiceI].prompt)">🔊 Listen</button>${body}<div id="practiceFeedback"></div>`);speak(p.prompt)}function practiceCheck(good,btn){if(practiceAnswer)return;practiceAnswer=true;if(btn)btn.classList.add(good?'correct':'wrong');if(good)award(15);let p=practices[practiceI];let solution=p.type==='hands'?'8:00':p.opts[p.correct];let f=document.getElementById('practiceFeedback');let explanation=(good?'Yes! You are correct. ':'Not quite. ')+ 'The correct answer is '+solution+'. '+(p.topic==='analog'?'The short hand points to eight, and the long hand points to twelve.':p.topic==='digital'?'Twenty hundred hours is eight o’clock in the evening.':p.topic==='ampm'?'AM means before noon, so morning times use AM.':p.topic==='elapsed'?'From three thirty to five thirty, exactly two hours pass.':'Add one hour to five twenty to reach six twenty. Then add fifty minutes to reach seven ten.');f.innerHTML=`<div class="feedback">${good?'🌟 Correct!':'💡 Not quite!'}<p>${explanation}</p><p class="mini">🔊 Listen to the explanation. The next activity will open automatically.</p></div>`;speakThenAdvance(explanation,()=>{if(mode==='practice'&&practiceAnswer){practiceI<4?showPractice(practiceI+1):startQuiz()}})}
const bank=[
{topic:'analog',q:'The minute hand points to 12 and the hour hand points to 7. What time is it?',opts:['7:00','12:35','7:12','12:07'],a:0,ex:'The long hand on 12 means zero minutes, and the short hand on 7 means 7 o’clock.',clock:[7,0]},
{topic:'digital',q:'What time does 13:00 show in 12-hour format?',opts:['3:00 AM','1:00 PM','11:00 AM','1:00 AM'],a:1,ex:'13 − 12 = 1, so 13:00 is 1:00 PM.',clock:[13,0]},
{topic:'ampm',q:'Which one means eight o’clock in the morning?',opts:['8:00 PM','20:00','8:00 AM','12:00 PM'],a:2,ex:'AM indicates the hours after midnight and before noon.'},
{topic:'analog',q:'A clock’s short hand points to 10, and its long hand points to 12. What time is it?',opts:['10:12','12:10','2:00','10:00'],a:3,ex:'The short hand indicates 10, and the long hand at 12 indicates 00 minutes.',clock:[10,0]},
{topic:'digital',q:'What is 20:00 in 12-hour time?',opts:['8:00 PM','8:00 AM','10:00 PM','2:00 PM'],a:0,ex:'20 − 12 = 8, so 20:00 is 8:00 PM.',clock:[20,0]},
{topic:'ampm',q:'Your alarm rings at 6:00 before school in the morning. Which is right?',opts:['6:00 PM','6:00 AM','18:00 AM','12:00 PM'],a:1,ex:'Morning at 6 o’clock is 6:00 AM.'},
{topic:'elapsed',q:'Start: 11:55 AM. End: 1:20 PM. What is the elapsed time?',opts:['1 hour 15 minutes','2 hours 25 minutes','1 hour 25 minutes','25 minutes'],a:2,ex:'11:55 to noon is 5 minutes, noon to 1:00 is 60, and 1:00 to 1:20 is 20. Total: 85 minutes.'},
{topic:'elapsed',q:'Start: 3:30 AM. End: 5:30 AM. How much time passed?',opts:['3 hours','30 minutes','2 hours 30 minutes','2 hours'],a:3,ex:'The minutes stay the same; 3:30 to 5:30 is exactly two hours.'},
{topic:'elapsed',q:'Start: 6:15 PM. End: 9:10 PM. How much time passed?',opts:['2 hours 55 minutes','3 hours 5 minutes','2 hours 45 minutes','3 hours 55 minutes'],a:0,ex:'6:15 to 9:15 is 3 hours. The end is 5 minutes earlier, so the total is 2 hours 55 minutes.'},

{topic:'movies',q:'A movie begins at 5:20 and lasts 1 hour 50 minutes. When does it finish?',opts:['6:50','7:20','6:10','7:10'],a:3,ex:'5:20 plus one hour is 6:20, and 50 more minutes makes 7:10.'}
];let review=false;function startQuiz(isReview=false){mode='quiz';review=isReview;level=2;quizIndex=0;answers=[];lock=false;questions=isReview?bank.filter(q=>focus.has(q.topic)):bank.slice();progress(76);showQuestion()}function showQuestion(){lock=false;let q=questions[quizIndex];progress(76+19*quizIndex/questions.length);card(`<span class="tag">${review?'RETRY CHALLENGE':'TIME MASTER QUIZ'} • ${quizIndex+1} / ${questions.length}</span><h2 class="sectionTitle">${q.q}</h2><button class="btn secondary small" onclick="speak(questions[quizIndex].q)">🔊 Listen to question</button>${q.clock?`<div class="clockwrap" style="margin:15px 0">${clock(...q.clock)}</div>`:''}<div class="choicegrid">${q.opts.map((v,i)=>`<button class="choice" id="opt${i}" onclick="answer(${i})">${v}</button>`).join('')}</div><div id="quizFeedback"></div>`);speak(q.q)}function answer(i){if(lock)return;lock=true;let q=questions[quizIndex],good=i===q.a;answers.push({topic:q.topic,good});document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;if(j===q.a)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});if(good)award(20);let solution=q.opts[q.a];let explanation=(good?'That is correct! Great job. ':'That is not correct yet. The correct answer is '+solution+'. ')+q.ex;document.getElementById('quizFeedback').innerHTML=`<div class="feedback"><h3>${good?'🌟 Correct answer!':'💡 Let’s learn!'}</h3><p>${good?'Well done!':'Correct answer: <b>'+solution+'</b>'}</p><p>${q.ex}</p><p class="mini">🔊 Listen to the explanation. The next question will open automatically.</p></div>`;let answeredIndex=quizIndex;speakThenAdvance(explanation,()=>{if(mode!=='quiz'||!lock||quizIndex!==answeredIndex)return;if(++quizIndex<questions.length)showQuestion();else finishQuiz()})}
function skipExplanation(){speechSynthesis.cancel();if(window.pendingNext){let cb=window.pendingNext;window.pendingNext=null;cb()}}function finishQuiz(){mode='result';let right=answers.filter(a=>a.good).length,score=Math.round(right/questions.length*100);if(score>=80){level=3;progress(100);award(100);cheer();card(`<div style="text-align:center"><div class="mascot">🏆🎉</div><h2 class="sectionTitle">Amazing! You passed!</h2><div class="starline">⭐⭐⭐⭐⭐</div><h1>${score}%</h1><p class="big">${right} of ${questions.length} answers correct.</p><p>You earned your Time Master Certificate.</p><input class="field" id="student" placeholder="Your full name" maxlength="65" aria-label="Student full name"><div class="actions"><button class="btn green" onclick="makeCertificate()">🏅 Unlock my certificate</button><button class="btn secondary" onclick="startQuiz()">Try quiz again</button></div></div>`);speak('Wonderful! You passed with '+score+' percent. Enter your name to receive your certificate.')}else{let wrong=answers.filter(a=>!a.good).map(a=>a.topic);focus=new Set(wrong);let missed=[...focus].map(k=>lessons.find(l=>l.concept===k));level=0;progress(12);card(`<div style="text-align:center"><div class="mascot">🦊📚</div><h2 class="sectionTitle">You are still learning!</h2><h1>${score}%</h1><p class="big">You need 80% to unlock your certificate.</p><p>Let's review only the concepts you missed.</p><div class="optionsline">${missed.map(x=>`<span class="optionchip">${x.emoji} ${x.title}</span>`).join('')}</div><div class="actions"><button class="btn green" onclick="beginReview()">🔁 Review my concepts</button></div></div>`);speak('You scored '+score+' percent. We will review the concepts you missed. You can do this!')}}let reviewList=[],reviewI=0;function beginReview(){mode='review';reviewList=[...focus].map(k=>lessons.findIndex(l=>l.concept===k));reviewI=0;showReview()}function showReview(){let j=reviewList[reviewI],l=lessons[j];progress(15+reviewI/reviewList.length*50);card(`<span class="tag">PERSONALIZED REVIEW ${reviewI+1} / ${reviewList.length}</span><h2 class="sectionTitle">${l.emoji} ${l.title}</h2><div class="twocol"><div>${lessonVisual(j)}</div><div><p style="font-size:20px;line-height:1.6">${l.text}</p><button class="btn secondary" onclick="speak(lessons[${j}].text)">🔊 Hear again</button></div></div><div class="actions"><button class="btn green" onclick="reviewI++;reviewI<reviewList.length?showReview():startQuiz()">${reviewI===reviewList.length-1?'📝 Retake Full Quiz':'Next Review ➡️'}</button></div>`);speak(l.text)}function makeCertificate(){let el=document.getElementById('student');certName=el.value.trim();if(!certName){el.focus();el.placeholder='Please type your name first';return}mode='certificate';level=3;progress(100);let dt=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});card(`<div class="certificate" id="cert"><div style="font-size:50px">🏆 ⭐ 🕒 ⭐ 🏆</div><p style="font-weight:1000;letter-spacing:4px">FOOTPRINTS</p><h2>Certificate of Achievement</h2><p>This certificate is proudly awarded to</p><div class="who"></div><p>for successfully completing</p><h2>Time Adventure</h2><p><b>Analog & Digital Clocks • AM/PM • Elapsed Time</b></p><p class="big">TIME MASTER • ${Math.round(answers.filter(a=>a.good).length/answers.length*100)}%</p><p>⭐ Curious Mind • Great Effort • Time Explorer ⭐</p><p>${dt}</p><p style="font-size:12px">By: Ing. Milko Gonzales C.</p></div><div class="actions noPrint"><button class="btn green" onclick="window.print()">🖨️ Print / Save PDF</button><button class="btn secondary" onclick="welcome()">🏠 Play Again</button></div>`);document.querySelector('.who').textContent=certName;cheer();speak('Congratulations '+certName+'. You are now a Footprints Time Master!')};welcome();
</script></body></html>
